<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZA DISTROAPP — Distribute Your Music Worldwide</title>
<style>
:root{
  --gold:#f5b301; --green:#22c55e; --bg:#0a0a0f; --bg2:#12121a; --card:#17171f;
  --border:#262633; --text:#f2f2f7; --muted:#9a9aad; --red:#ef4444;
  --grad:linear-gradient(135deg,#f5b301 0%,#f97316 55%,#ef4444 100%);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--gold);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.container{max-width:1100px;margin:0 auto;padding:0 24px}

nav{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff;cursor:pointer;letter-spacing:.5px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px}
.logo small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;font-weight:700}
.nav-links{display:flex;align-items:center;gap:20px}
.nav-links a{color:var(--muted);font-size:14px;font-weight:600}
.nav-links a:hover{color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;font-weight:700;font-size:15px;padding:12px 24px;transition:.15s}
.btn-primary{background:var(--grad);color:#1a1005}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--gold)}
.btn-green{background:var(--green);color:#04120a}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.hero{text-align:center;padding:90px 24px 64px;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(245,179,1,.16),transparent)}
.hero .badge{display:inline-block;background:rgba(245,179,1,.12);border:1px solid rgba(245,179,1,.4);color:var(--gold);font-size:12px;font-weight:800;padding:6px 16px;border-radius:20px;letter-spacing:1px;margin-bottom:22px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;font-weight:900}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:18px;max-width:600px;margin:20px auto 32px}
.hero .btn{font-size:17px;padding:16px 36px}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:8px 0 60px}
.plan{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;position:relative}
.plan.featured{border-color:var(--gold);box-shadow:0 0 44px rgba(245,179,1,.13)}
.plan .tag{position:absolute;top:-12px;left:24px;background:var(--grad);color:#1a1005;font-size:11px;font-weight:900;padding:4px 12px;border-radius:20px;letter-spacing:.5px}
.plan h3{font-size:20px}
.plan .price{font-size:36px;font-weight:900;margin:10px 0 2px}
.plan .per{color:var(--muted);font-size:13px;margin-bottom:18px}
.plan ul{list-style:none;margin-bottom:22px}
.plan li{padding:7px 0;color:var(--muted);font-size:14px;display:flex;gap:9px}
.plan li::before{content:"✓";color:var(--green);font-weight:800}
.plan li.no::before{content:"—";color:var(--muted)}
.plan li.no{color:#5a5a6e}

.auth-wrap{max-width:430px;margin:56px auto;padding:36px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.auth-wrap h2{margin-bottom:6px}
.auth-wrap p.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 13px;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.error{color:#f87171;font-size:13px;margin:8px 0;display:none}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.sidebar{border-right:1px solid var(--border);padding:24px 14px;background:var(--bg2)}
.sidebar a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:4px}
.sidebar a:hover{color:#fff;background:rgba(255,255,255,.04)}
.sidebar a.active{color:#fff;background:rgba(245,179,1,.13)}
.main{padding:32px 36px}
.page-title{font-size:26px;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:26px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stat-card .label{color:var(--muted);font-size:13px;margin-bottom:8px}
.stat-card .value{font-size:26px;font-weight:900}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th,td{padding:13px 16px;text-align:left;font-size:14px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:none}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
.pill-live{background:rgba(34,197,94,.14);color:#4ade80}
.pill-review{background:rgba(251,191,36,.14);color:#fbbf24}
.pill-pending{background:rgba(154,154,173,.14);color:var(--muted)}
.pill-red{background:rgba(239,68,68,.14);color:#f87171}
.store-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;margin:3px}

.wizard-steps{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.wstep{flex:1;min-width:110px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:10px 4px;border-bottom:3px solid var(--border)}
.wstep.active{color:var(--gold);border-color:var(--gold)}
.wstep.done{color:var(--green);border-color:var(--green)}
.wcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px;max-width:740px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;display:block}
.drop:hover{border-color:var(--gold);color:var(--gold)}
.track-row{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.track-row .num{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#1a1005;flex-shrink:0}
.track-row .grow{flex:1;min-width:0}
.track-row .grow input{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;outline:none}
.track-row .meta{font-size:12px;color:#4ade80}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.store-opt{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:13px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600;user-select:none}
.store-opt.on{border-color:var(--green);background:rgba(34,197,94,.08)}
.art-preview{width:190px;height:190px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden;margin-top:12px}
.art-preview img{width:100%;height:100%;object-fit:cover}
.wiz-nav{display:flex;justify-content:space-between;margin-top:26px;max-width:740px}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
canvas.chart{width:100%;height:220px}

.split-row{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.split-row input{background:transparent;border:none;color:var(--text);outline:none;font-size:14px}
.split-row .pct{width:80px;text-align:right;font-weight:800;color:var(--gold)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#052e16;border:1px solid var(--green);color:#4ade80;padding:13px 24px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;display:none;max-width:90vw;text-align:center}
.toast.err{background:#2e0505;border-color:var(--red);color:#f87171}
.footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--muted);font-size:13px}
.progress{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--grad);width:0%;transition:width .3s}

@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:10px}.sidebar a{white-space:nowrap}.grid2{grid-template-columns:1fr}.main{padding:22px}}
</style>
</head>
<body>

<nav><div class="container nav-inner">
  <div class="logo" onclick="go('/')"><div class="logo-mark">⚡</div><div>EZA DISTROAPP<small>BY HB PEZA</small></div></div>
  <div class="nav-links" id="navLinks"></div>
</div></nav>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =============== API =============== */
let token=localStorage.getItem('eza_token'), me=null, REL=[], STORES=[], PLANS={};
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&path!=='/api/auth/login'){logout(true)}
  if(!r.ok)throw new Error(d.error||('Error '+r.status));
  return d;
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=n=>Number(n).toLocaleString();
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}
function go(r){location.hash=r}
let route=location.hash.replace('#','')||'/';
window.addEventListener('hashchange',()=>{route=location.hash.replace('#','')||'/';boot()});

/* =============== ROUTER =============== */
function renderNav(){
  const n=$('#navLinks');
  if(me){
    const admin=me.role==='admin';
    n.innerHTML=`${admin?'<a href="#/admin">🛡️ Admin</a>':''}<a href="#/dashboard">Dashboard</a>
      ${admin?'':`<a href="#/upload" class="btn btn-primary btn-sm">⬆ Upload</a>`}
      <a href="javascript:void(0)" onclick="logout()" style="color:var(--muted)">Log out</a>`;
  }else{
    n.innerHTML=`<a href="#/login">Log in</a><a href="#/signup" class="btn btn-primary btn-sm">Sign up</a>`;
  }
}
async function boot(){
  renderNav();
  const app=$('#app');
  const authedRoutes=['/dashboard','/releases','/upload','/earnings','/splits','/payouts','/settings','/admin'];
  if(authedRoutes.includes(route)&&!me){if(!token)return go('/login');try{const d=await api('/api/me');me=d.user;PLANS[d.plan.id]=d.plan;renderNav()}catch(e){return go('/login')}}
  if(route==='/admin'&&me&&me.role!=='admin'){toast('Admin only.',true);return go('/dashboard')}
  switch(route){
    case '/login':return vLogin(app);
    case '/signup':return vSignup(app);
    case '/dashboard':case '/releases':case '/upload':case '/earnings':case '/splits':case '/payouts':case '/settings':case '/admin':return vShell(app);
    default:return vHome(app);
  }
}

/* =============== PUBLIC VIEWS =============== */
function planCards(compact){
  const P=[
    {id:'free',name:'FREE PLAN',price:'$0',per:'no upfront fee',feats:['Unlimited releases','All 10 major stores','Spotify, Apple, TikTok, YouTube','Keep 85% of earnings','Release stats'],no:['15% EZA commission on sales']},
    {id:'pro',name:'EZA PRO',price:'$19.99',per:'per year',feats:['Everything in Free','Keep 100% of your earnings','$0 commission forever','Custom label name','Priority review (faster go-live)','Founder support from HB pEza'],no:[]},
  ];
  return P.map(p=>`
    <div class="plan ${p.id==='pro'?'featured':''}">${p.id==='pro'?'<div class="tag">MOST POPULAR</div>':''}
      <h3>${p.name}</h3><div class="price">${p.price}</div><div class="per">${p.per}</div>
      <ul>${p.feats.map(f=>`<li>${f}</li>`).join('')}${p.no.map(f=>`<li class="no">${f}</li>`).join('')}</ul>
      ${compact?'':`<button class="btn ${p.id==='pro'?'btn-primary':'btn-ghost'}" style="width:100%" onclick="go('/signup')">Get started</button>`}
    </div>`).join('');
}
function vHome(app){
  app.innerHTML=`
  <div class="hero">
    <div class="badge">⚡ FOUNDED BY ARTIST HB PEZA</div>
    <h1>Your music.<br><span>Everywhere it matters.</span></h1>
    <p>EZA DISTROAPP puts your songs on Spotify, Apple Music, TikTok, YouTube and every major store. Choose: pay nothing upfront and share 15% of earnings — or go EZA Pro and keep 100%.</p>
    <a href="#/signup" class="btn btn-primary">Start distributing →</a>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap">
      <span class="store-chip">🟢 Spotify</span><span class="store-chip">🍎 Apple Music</span><span class="store-chip">▶️ YouTube Music</span><span class="store-chip">🎵 TikTok</span><span class="store-chip">🌊 TIDAL</span><span class="store-chip">📦 Amazon</span>
    </div>
  </div>
  <div class="container">
    <h2 style="text-align:center;margin-bottom:8px">Two ways to get paid</h2>
    <p style="text-align:center;color:var(--muted);margin-bottom:32px">Pick a plan <b>before you upload</b> — your commission applies <b>after you start selling</b>.</p>
    <div class="plans">${planCards()}</div>
  </div>
  <div class="footer">© 2026 EZA DISTROAPP · Founded by HB pEza · All rights reserved.</div>`;
}
function vSignup(app){
  app.innerHTML=`<div class="auth-wrap">
    <h2>Join EZA DISTROAPP</h2><p class="sub">Create your artist account. Distribute worldwide.</p>
    <div class="field"><label>Artist name</label><input id="sName" placeholder="Your stage name"></div>
    <div class="field"><label>Email</label><input id="sEmail" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="sPass" type="password" placeholder="Min 6 characters"></div>
    <div class="field"><label>Choose your plan</label>
      <select id="sPlan"><option value="free">FREE — pay nothing upfront, keep 85%</option><option value="pro">EZA PRO — $19.99/yr, keep 100%</option></select></div>
    <div class="error" id="sErr"></div>
    <button class="btn btn-primary" style="width:100%" onclick="doSignup()">Create account</button>
    <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--muted)">Already registered? <a href="#/login">Log in</a></p>
  </div>`;
}
async function doSignup(){
  try{
    const d=await api('/api/auth/signup',{method:'POST',body:JSON.stringify({name:$('#sName').value.trim(),email:$('#sEmail').value.trim(),password:$('#sPass').value,plan:$('#sPlan').value})});
    token=d.token;localStorage.setItem('eza_token',token);me=d.user;
    toast('⚡ Welcome to EZA DISTROAPP, '+me.artist+'!');go('/dashboard');
  }catch(e){const el=$('#sErr');el.textContent=e.message;el.style.display='block'}
}
function vLogin(app){
  app.innerHTML=`<div class="auth-wrap">
    <h2>Log in</h2><p class="sub">Your music empire awaits.</p>
    <div class="field"><label>Email</label><input id="lEmail" type="email"></div>
    <div class="field"><label>Password</label><input id="lPass" type="password"></div>
    <div class="error" id="lErr"></div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Log in</button>
    <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--muted)">New artist? <a href="#/signup">Create an account</a></p>
  </div>`;
}
async function doLogin(){
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#lEmail').value.trim(),password:$('#lPass').value})});
    token=d.token;localStorage.setItem('eza_token',token);me=d.user;
    toast('⚡ Welcome back, '+me.artist+'!');go(me.role==='admin'?'/admin':'/dashboard');
  }catch(e){const el=$('#lErr');el.textContent=e.message;el.style.display='block'}
}
function logout(silent){token=null;me=null;localStorage.removeItem('eza_token');if(!silent)toast('Logged out.');go('/')}

/* =============== APP SHELL =============== */
async function refreshReleases(){const d=await api('/api/releases'+(me.role==='admin'?'?all=1':''));REL=d.releases;STORES=d.stores;PLANS=d.plans}
function vShell(app){
  const page=route.slice(1)||'dashboard';
  const isAdmin=me.role==='admin';
  const tabs=isAdmin?[['admin','🛡️','Admin Panel']]:[['dashboard','🏠','Dashboard'],['releases','💿','My Releases'],['upload','⬆️','Upload'],['earnings','💰','Earnings'],['splits','🤝','Splits'],['payouts','🏦','Payouts'],['settings','⚙️','Settings']];
  app.innerHTML=`<div class="shell">
    <div class="sidebar">${tabs.map(t=>`<a href="#/${t[0]}" class="${page===t[0]?'active':''}">${t[1]} ${t[2]}</a>`).join('')}</div>
    <div class="main" id="main"><div class="empty">Loading…</div></div>
  </div>`;
  refreshReleases().then(()=>{
    ({dashboard:pgDash,releases:pgReleases,upload:pgUpload,earnings:pgEarn,splits:pgSplits,payouts:pgPay,settings:pgSet,admin:pgAdmin}[page]||pgDash)($('#main'));
  }).catch(e=>{$('#main').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
}

/* =============== ARTIST PAGES =============== */
function pgDash(m){
  const tot=REL.reduce((a,r)=>{a.g+=r.earnings.net;a.s+=r.earnings.streams;return a},{g:0,s:0});
  const live=REL.reduce((n,r)=>n+r.liveCount,0);
  const plan=PLANS[me.plan]||{name:me.plan};
  m.innerHTML=`
  <div class="page-title">⚡ Hey ${esc(me.artist)}</div>
  <div class="page-sub">Plan: <b style="color:var(--gold)">${esc(plan.name)}</b> · ${PLANS[me.plan]?.commission>0?'EZA keeps '+(PLANS[me.plan].commission*100)+'% of earnings':'You keep 100% of earnings'}</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Lifetime earnings (net)</div><div class="value">${fmt$(tot.g)}</div></div>
    <div class="stat-card"><div class="label">Total streams</div><div class="value">${fmtN(tot.s)}</div></div>
    <div class="stat-card"><div class="label">Releases</div><div class="value">${REL.length}</div></div>
    <div class="stat-card"><div class="label">Live in stores</div><div class="value">${live}</div></div>
  </div>
  <div class="chart-card"><b>Streams — last 30 days</b><canvas class="chart" id="ch" width="1000" height="220"></canvas></div>
  <div class="chart-card"><b>Latest release</b><div id="lat"></div></div>`;
  drawChart($('#ch'),30);
  const r=REL[0];
  $('#lat').innerHTML=r?relBlock(r):`<div class="empty">No releases yet — <a href="#/upload">upload your first track</a>! 🎧</div>`;
}
function relBlock(r){
  const pills={live:'<span style="color:#4ade80">●</span>',delivering:'<span style="color:#fbbf24">●</span>',in_review:'<span style="color:var(--muted)">●</span>',rejected:'<span style="color:#f87171">●</span>',taken_down:'<span style="color:#f87171">■</span>'};
  const stName={live:'Live',delivering:'Delivering',in_review:'In review',rejected:'Rejected',taken_down:'Taken down'};
  const overall=r.status==='rejected'?'<span class="pill pill-red">✕ Rejected</span>':r.status==='taken_down'?'<span class="pill pill-red">■ Taken down</span>':r.liveCount>0?`<span class="pill pill-live">● LIVE in ${r.liveCount}/${r.stores.length}</span>`:'<span class="pill pill-review">● In review</span>';
  return `<div style="margin-top:14px">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div class="art-preview" style="width:70px;height:70px;margin:0">${r.artUrl?`<img src="${r.artUrl}">`:'💿'}</div>
      <div style="flex:1;min-width:180px"><b style="font-size:17px">${esc(r.title)}</b>
        <div style="color:var(--muted);font-size:13px;margin-top:3px">${esc(r.artistName)} · ${esc(r.genre)} · ${r.tracks.length} track(s)</div>

function pgEarn(m){
  const tot=REL.reduce((a,r)=>{a.g+=r.earnings.gross;a.f+=r.earnings.fee;a.n+=r.earnings.net;a.s+=r.earnings.streams;return a},{g:0,f:0,n:0,s:0});
  const perStore=STORES.map(s=>{let st=0,ear=0;REL.forEach(r=>{if(!r.stores.includes(s.id))return;const share=1/Math.max(1,r.stores.length);st+=r.earnings.streams*share;ear+=r.earnings.net*share});return{s,st,ear}}).sort((a,b)=>b.ear-a.ear);
  m.innerHTML=`<div class="page-title">Earnings</div><div class="page-sub">Your plan: <b style="color:var(--gold)">${esc((PLANS[me.plan]||{}).name||me.plan)}</b>${PLANS[me.plan]?.commission>0?` — EZA commission: <b style="color:#f87171">${fmt$(tot.f)}</b> (15%)`:''}</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Gross earnings</div><div class="value">${fmt$(tot.g)}</div></div>
    <div class="stat-card"><div class="label">EZA commission</div><div class="value" style="color:#f87171">${fmt$(tot.f)}</div></div>
    <div class="stat-card"><div class="label">Your net (payable)</div><div class="value" style="color:#4ade80">${fmt$(tot.n)}</div></div>
    <div class="stat-card"><div class="label">Total streams</div><div class="value">${fmtN(tot.s)}</div></div>
  </div>
  <div class="chart-card"><b>Streams — last 60 days</b><canvas class="chart" id="ch2" width="1000" height="220"></canvas></div>
  <div class="chart-card"><b>Earnings by store</b><table><tr><th>Store</th><th>Streams</th><th>Est. earnings</th></tr>
  ${perStore.map(x=>`<tr><td>${x.s.icon} ${x.s.name}</td><td>${fmtN(Math.round(x.st))}</td><td>${fmt$(x.ear)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No data yet</td></tr>'}</table></div>`;
  drawChart($('#ch2'),60);
}
function drawChart(cv,days){
  if(!cv)return;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  const DAYMS=86400e3,now=Date.now();
  const data=[];
  for(let d=days-1;d>=0;d--){
    let v=0;
    REL.forEach(r=>{
      if(r.status==='rejected'||r.status==='taken_down')return;
      const age=Math.floor((now-r.submittedAt)/DAYMS);
      if(d>age||age<0)return;
      const total=r.earnings.streams;if(!total)return;
      let sum=0;for(let k=0;k<=age;k++)sum+=Math.max(.12,1-k/(age+3));
      v+=total*Math.max(.12,1-d/(age+3))/sum;
    });
    data.push(Math.round(v));
  }
  const max=Math.max(...data,10);
  const bw=W/days;
  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'rgba(245,179,1,.9)');grad.addColorStop(1,'rgba(239,68,68,.3)');
  data.forEach((val,i)=>{if(val<=0)return;const h=(val/max)*(H-24);ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(i*bw+1,H-h-2,Math.max(2,bw-3),h,3);ctx.fill()});
  ctx.fillStyle='#9a9aad';ctx.font='12px sans-serif';ctx.fillText(fmtN(max)+' streams/day',4,14);
}

/* ---- payouts ---- */
function pgPay(m){
  const net=REL.reduce((n,r)=>n+r.earnings.net,0);
  m.innerHTML=`<div class="page-title">Payouts</div><div class="page-sub">Paid automatically on the 1st of every month.</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Available balance</div><div class="value" style="color:#4ade80">${fmt$(net*0.72)}</div></div>
    <div class="stat-card"><div class="label">Next payout</div><div class="value">${nextPayout()}</div></div>
  </div>
  <div class="wcard"><b style="font-size:16px">Payout method</b>
    <div class="grid2" style="margin-top:16px">
      <div class="field"><label>Account holder</label><input id="bkH" value="${esc(me.bank?.holder||me.artist)}"></div>
      <div class="field"><label>Routing / Sort code</label><input id="bkR" value="${esc(me.bank?.route||'')}" placeholder="021000021"></div>
      <div class="field"><label>Account number</label><input id="bkA" value="${esc(me.bank?.acct||'')}" placeholder="1234567890"></div>
      <div class="field"><label>Bank name</label><input id="bkB" placeholder="Your bank"></div>
    </div>
    <button class="btn btn-primary" onclick="saveBank()">Save payout method</button>
    <p style="color:var(--muted);font-size:13px;margin-top:14px">💡 Min threshold $0 · arrives 1–5 business days after payout date.</p></div>`;
}
function nextPayout(){const d=new Date();const t=new Date(d.getFullYear(),d.getMonth()+1,1);return t.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}
async function saveBank(){try{const d=await api('/api/me',{method:'PUT',body:JSON.stringify({bank:{holder:$('#bkH').value,route:$('#bkR').value,acct:$('#bkA').value}})});me=d.user;toast('Payout method saved 💳')}catch(e){toast(e.message,true)}}

/* ---- settings ---- */
function pgSet(m){
  m.innerHTML=`<div class="page-title">Settings</div><div class="page-sub">Account, artist profile & plan.</div>
  <div class="wcard" style="margin-bottom:20px"><b style="font-size:16px">Profile</b>
    <div class="grid2" style="margin-top:16px">
      <div class="field"><label>Artist name</label><input id="stA" value="${esc(me.artist)}"></div>
      <div class="field"><label>Email (login)</label><input value="${esc(me.email)}" disabled></div>
    </div>
    <button class="btn btn-primary" onclick="saveProfile()">Save changes</button></div>
  <div class="wcard"><b style="font-size:16px">Plan</b>
    <p style="color:var(--muted);font-size:14px;margin:10px 0 4px">Current: <b style="color:var(--gold)">${esc((PLANS[me.plan]||{}).name||me.plan)}</b>${PLANS[me.plan]?.commission>0?' — EZA keeps 15% of your earnings':' — you keep 100%'}</p>
    <div class="plans" style="padding-bottom:0">${['free','pro'].filter(p=>p!==me.plan).map(p=>{
      const P=PLANS[p];return `<div class="plan"><h3>${esc(P.name)}</h3><div class="price">$${P.price}</div><div class="per">${P.price?'per year':'no upfront fee'}</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px">${esc(P.blurb)}</p>
      <button class="btn btn-ghost" style="width:100%" onclick="switchPlan('${p}')">Switch to ${esc(P.name)}</button></div>`}).join('')||''}
    </div></div>`;
}
async function saveProfile(){try{const d=await api('/api/me',{method:'PUT',body:JSON.stringify({artist:$('#stA').value,name:$('#stA').value})});me=d.user;toast('Profile saved ✓');renderNav()}catch(e){toast(e.message,true)}}
async function switchPlan(p){try{const d=await api('/api/me',{method:'PUT',body:JSON.stringify({plan:p})});me=d.user;toast('Plan switched! 🎉');pgSet(document.querySelector('.main'))}catch(e){toast(e.message,true)}}

/* =============== ADMIN (HB PEZA) =============== */
async function pgAdmin(m){
  let st;try{st=await api('/api/admin/stats')}catch(e){m.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  const allUsers=await api('/api/releases?all=1').then(d=>d.releases).catch(()=>[]);
  m.innerHTML=`
  <div class="page-title">🛡️ EZA Admin — HB pEza</div><div class="page-sub">Platform control center.</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Artists signed up</div><div class="value">${st.users}</div></div>
    <div class="stat-card"><div class="label">Total releases</div><div class="value">${st.releases}</div></div>
    <div class="stat-card"><div class="label">Live releases</div><div class="value" style="color:#4ade80">${st.live}</div></div>
    <div class="stat-card"><div class="label">PRO members</div><div class="value" style="color:var(--gold)">${st.proUsers}</div></div>
    <div class="stat-card"><div class="label">Gross royalties</div><div class="value">${fmt$(st.gross)}</div></div>
    <div class="stat-card"><div class="label">Platform fees (15% cut)</div><div class="value" style="color:#4ade80">${fmt$(st.platformFees)}</div></div>
  </div>
  <div class="chart-card"><b>Streams across platform — last 60 days</b><canvas class="chart" id="cha" width="1000" height="200"></canvas></div>
  <div class="chart-card"><b>All releases (approve → instant live)</b><div id="admRel"></div></div>`;
  REL=allUsers;
  $('#admRel').innerHTML=REL.length?REL.map(r=>`
    <div style="border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg2)">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="art-preview" style="width:52px;height:52px;margin:0">${r.artUrl?`<img src="${r.artUrl}">`:'💿'}</div>
        <div style="flex:1;min-width:200px"><b>${esc(r.title)}</b> — ${esc(r.artistName)}
          <div style="color:var(--muted);font-size:12px">${esc(r.ownerEmail)} · ${esc(r.genre)} · plan: ${esc(r.planOwner)} · submitted ${new Date(r.submittedAt).toLocaleString()}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${r.status!=='rejected'&&r.liveCount===0?`<button class="btn btn-green btn-sm" onclick="admDecision('${r.id}','approve')">✓ Approve (live now)</button>`:''}
          ${r.status==='rejected'?`<button class="btn btn-ghost btn-sm" onclick="admDecision('${r.id}','restore')">↩ Restore</button>`:`<button class="btn btn-red btn-sm" onclick="admDecision('${r.id}','reject')">✕ Reject</button>`}
          ${r.status!=='taken_down'?`<button class="btn btn-ghost btn-sm" onclick="admDecision('${r.id}','takedown')">⛔ Takedown</button>`:''}
        </div></div>
      <div style="margin-top:10px">${relBlock(r)}</div>
    </div>`).join(''):`<div class="empty">No releases yet.</div>`;
  drawChart($('#cha'),60);
}
async function admDecision(id,action){
  try{await api(`/api/admin/releases/${id}/decision`,{method:'POST',body:JSON.stringify({action})});
    toast({approve:'✅ Approved — going live now',reject:'Release rejected',restore:'Release restored',takedown:'⛔ Taken down'}[action]);
    pgAdmin(document.querySelector('.main'));
  }catch(e){toast(e.message,true)}
}

boot();
</script>
</body>
</html>
